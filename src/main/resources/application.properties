server.port=${DEPLOYER_PORT:8080}

spring.application.name=deployer
spring.threads.virtual.enabled=true
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
spring.servlet.multipart.file-size-threshold=10MB

deployer.work-dir=${user.dir}/data
deployer.startup-timeout=90s
deployer.panel-port=${server.port}
deployer.app-port=${DEPLOYER_APP_PORT:9090}
deployer.public-host=${DEPLOYER_PUBLIC_HOST:}
deployer.auth.username=${DEPLOYER_USER:poolerss}
deployer.auth.password=${DEPLOYER_PASSWORD:pool1987}

server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
