name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Package
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - uses: actions/upload-artifact@v6
        with:
          name: deployer-jar
          path: target/deployer-1.0.0.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deployer-jar

      - name: Copy jar and restart service
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "Add repository secrets VPS_HOST, VPS_USER and VPS_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 <<'PY'
          import os, re, textwrap
          from pathlib import Path

          raw = os.environ["KEY"].replace("\r\n", "\n").replace("\r", "\n").strip().strip("\"'")
          raw = raw.replace("\\n", "\n")
          match = re.search(r"-----BEGIN ([^-]+)-----", raw)
          if not match:
              raise SystemExit("VPS_SSH_KEY is not a private key. Paste the output of cat /root/github-deployer, not the .pub file.")
          label = match.group(1).strip()
          body = re.sub(r"-----BEGIN [^-]+-----", "", raw)
          body = re.sub(r"-----END [^-]+-----", "", body)
          body = re.sub(r"\s+", "", body)
          if len(body) < 80:
              raise SystemExit("VPS_SSH_KEY looks truncated.")
          pem = (
              f"-----BEGIN {label}-----\n"
              + "\n".join(textwrap.wrap(body, 70))
              + f"\n-----END {label}-----\n"
          )
          path = Path.home() / ".ssh" / "deploy_key"
          path.write_text(pem)
          path.chmod(0o600)
          PY
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deployer-1.0.0.jar "$USER@$HOST:/tmp/deployer.jar"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$USER@$HOST" 'sudo mv /tmp/deployer.jar /opt/deployer/deployer.jar && sudo chown deployer:deployer /opt/deployer/deployer.jar && sudo systemctl restart deployer'
